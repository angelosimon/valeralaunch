<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valera Launcher</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
font-family:'Inter',sans-serif;
color:#fff;
min-height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(10,12,20,.6),rgba(10,12,20,.85)),
url("https://i.ibb.co/BJqNWfJ/image.png") center/cover no-repeat;
}

/* container */

.hero{
max-width:720px;
padding:40px;
animation:fade 1.2s ease;
}

/* logo */

.logo{
width:70px;
margin-bottom:26px;
opacity:.95;
}

/* title */

h1{
font-size:clamp(48px,6vw,86px);
font-weight:800;
letter-spacing:-.05em;
line-height:1.05;
margin-bottom:22px;
}

/* subtitle */

p{
color:rgba(255,255,255,.7);
font-size:18px;
line-height:1.6;
margin-bottom:36px;
}

/* button */

.btn{
display:inline-flex;
align-items:center;
gap:10px;
padding:16px 28px;
border-radius:40px;
background:#6f8cff;
font-weight:600;
font-size:17px;
transition:.25s;
box-shadow:0 15px 40px rgba(111,140,255,.35);
}

.btn:hover{
transform:translateY(-3px);
background:#7f98ff;
box-shadow:0 20px 50px rgba(111,140,255,.45);
}

/* footer */

.footer{
position:absolute;
bottom:24px;
left:0;
right:0;
font-size:13px;
color:rgba(255,255,255,.35);
}

/* animations */

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="hero">

<img class="logo"
src="https://i.ibb.co/G4dBMDwF/Screenshot-2026-03-09-153726-removebg-preview.webp">

<h1>Valera Launcher</h1>

<p>
Fast and minimal Minecraft launcher for macOS.
Built for smooth performance and simple gameplay.
</p>

<a class="btn" id="downloadBtn">
Download for macOS
</a>

</div>

<div class="footer">
Created by Khreshyatikov
</div>

<script>
document.getElementById('downloadBtn').onclick=function(){
window.location.href="https://github.com/angelosimon/valeralaunch/releases/download/launcher/valeralaucnher.dmg";
};
</script>

</body>
</html>
