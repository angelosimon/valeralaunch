<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valera Launcher</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#070b14;
      --panel:rgba(14,18,28,.72);
      --panel-border:rgba(255,255,255,.06);
      --text:#f5f7ff;
      --muted:rgba(255,255,255,.72);
      --muted2:rgba(255,255,255,.5);
      --blue:#6f8cff;
      --blue2:#86a0ff;
      --shadow:0 20px 80px rgba(0,0,0,.38);
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#070b14;
      color:var(--text);
      overflow-x:hidden;
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
      border:none;
      background:none;
      color:inherit;
      cursor:pointer;
    }

    .page{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      background:#070b14;
    }

    .bg{
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(8,11,20,.28) 0%, rgba(8,11,20,.68) 100%),
        radial-gradient(circle at center, rgba(8,11,20,.10) 0%, rgba(8,11,20,.36) 58%, rgba(8,11,20,.74) 100%),
        url("https://i.ibb.co/BJqNWfJ/image.png") center center / cover no-repeat;
      transform:scale(1.03);
      animation:bgFloat 16s ease-in-out infinite alternate;
    }

    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(7,11,20,.7) 0%, rgba(7,11,20,.45) 36%, rgba(7,11,20,.22) 56%, rgba(7,11,20,.46) 100%);
    }

    .container{
      position:relative;
      z-index:2;
      width:100%;
      max-width:1280px;
      margin:0 auto;
      padding:0 24px;
    }

    .topbar-wrap{
      display:flex;
      justify-content:center;
      padding-top:34px;
      animation:fadeDown .7s ease both;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      width:min(100%, 620px);
      min-height:56px;
      padding:8px 10px 8px 16px;
      border-radius:18px;
      background:var(--panel);
      border:1px solid var(--panel-border);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 10px 40px rgba(0,0,0,.24);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      white-space:nowrap;
      font-size:16px;
      font-weight:800;
      letter-spacing:-.04em;
    }

    .brand-logo{
      width:28px;
      height:28px;
      object-fit:contain;
      display:block;
      flex-shrink:0;
    }

    .nav{
      display:flex;
      align-items:center;
      gap:22px;
    }

    .nav a,
    .nav button{
      font-size:13px;
      font-weight:500;
      color:rgba(255,255,255,.72);
      transition:.2s;
      position:relative;
    }

    .nav a:hover,
    .nav button:hover,
    .nav a.active{
      color:#fff;
    }

    .contact-item{
      position:relative;
    }

    .contact-btn{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .contact-btn svg{
      width:12px;
      height:12px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      transition:transform .2s ease;
    }

    .contact-item.open .contact-btn svg{
      transform:rotate(180deg);
    }

    .contact-menu{
      position:absolute;
      top:calc(100% + 12px);
      right:0;
      min-width:210px;
      padding:8px;
      border-radius:14px;
      background:rgba(13,17,26,.92);
      border:1px solid rgba(255,255,255,.07);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 18px 40px rgba(0,0,0,.28);
      opacity:0;
      visibility:hidden;
      transform:translateY(8px);
      transition:.22s ease;
      z-index:30;
    }

    .contact-item.open .contact-menu{
      opacity:1;
      visibility:visible;
      transform:translateY(0);
    }

    .contact-link{
      display:flex;
      flex-direction:column;
      gap:4px;
      padding:12px 12px;
      border-radius:10px;
      transition:.2s;
    }

    .contact-link:hover{
      background:rgba(255,255,255,.05);
    }

    .contact-title{
      font-size:13px;
      font-weight:600;
      color:#fff;
    }

    .contact-sub{
      font-size:12px;
      color:rgba(255,255,255,.56);
      line-height:1.4;
      word-break:break-word;
    }

    .hero{
      min-height:calc(100vh - 90px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 0 80px;
    }

    .hero-inner{
      width:100%;
      max-width:760px;
      text-align:center;
      margin:0 auto;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:#7f96ff;
      font-size:14px;
      font-weight:700;
      letter-spacing:-.03em;
      text-transform:uppercase;
      animation:fadeUp .75s ease .08s both;
    }

    .eyebrow::before,
    .eyebrow::after{
      content:"⌁";
      font-size:14px;
      line-height:1;
      opacity:.95;
    }

    h1{
      margin-top:20px;
      font-size:clamp(56px, 7vw, 94px);
      line-height:.92;
      font-weight:800;
      letter-spacing:-.08em;
      text-wrap:balance;
      animation:fadeUp .8s ease .16s both;
    }

    .subtext{
      max-width:640px;
      margin:26px auto 0;
      color:var(--muted);
      font-size:16px;
      line-height:1.7;
      animation:fadeUp .85s ease .24s both;
    }

    .actions{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
      margin-top:28px;
      animation:fadeUp .9s ease .32s both;
    }

    .primary-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-width:150px;
      height:54px;
      padding:0 24px;
      border-radius:999px;
      background:linear-gradient(180deg, var(--blue2), var(--blue));
      color:#fff;
      font-size:16px;
      font-weight:700;
      box-shadow:0 14px 35px rgba(111,140,255,.28);
      transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .primary-btn:hover{
      transform:translateY(-2px);
      filter:brightness(1.03);
      box-shadow:0 20px 42px rgba(111,140,255,.34);
    }

    .primary-btn svg{
      width:16px;
      height:16px;
      stroke:#fff;
      fill:none;
      stroke-width:2.2;
      stroke-linecap:round;
      stroke-linejoin:round;
      flex-shrink:0;
    }

    .secondary-btn{
      color:rgba(255,255,255,.74);
      font-size:16px;
      font-weight:500;
      transition:.2s;
    }

    .secondary-btn:hover{
      color:#fff;
    }

    .footer-note{
      position:absolute;
      left:24px;
      bottom:20px;
      z-index:2;
      color:rgba(255,255,255,.38);
      font-size:12px;
      font-weight:500;
      letter-spacing:-.01em;
      animation:fadeUp .9s ease .42s both;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(24px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeDown{
      from{
        opacity:0;
        transform:translateY(-20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes bgFloat{
      from{
        transform:scale(1.03) translateY(0);
      }
      to{
        transform:scale(1.07) translateY(-10px);
      }
    }

    @media (max-width: 860px){
      .topbar{
        width:min(100%, 100%);
      }
    }

    @media (max-width: 720px){
      .container{
        padding:0 16px;
      }

      .topbar-wrap{
        padding-top:16px;
      }

      .topbar{
        width:100%;
        min-height:auto;
        padding:12px;
        border-radius:16px;
        flex-wrap:wrap;
        justify-content:center;
      }

      .brand{
        width:100%;
        justify-content:center;
      }

      .nav{
        width:100%;
        justify-content:center;
        flex-wrap:wrap;
        gap:14px;
      }

      .contact-menu{
        left:50%;
        right:auto;
        transform:translateX(-50%) translateY(8px);
      }

      .contact-item.open .contact-menu{
        transform:translateX(-50%) translateY(0);
      }

      .hero{
        padding:34px 0 70px;
      }

      h1{
        font-size:clamp(42px, 14vw, 62px);
      }

      .subtext{
        font-size:15px;
        margin-top:18px;
      }

      .actions{
        margin-top:22px;
        gap:14px;
      }

      .primary-btn,
      .secondary-btn{
        width:100%;
      }

      .secondary-btn{
        text-align:center;
      }

      .footer-note{
        position:static;
        padding:0 16px 18px;
        text-align:center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg"></div>

    <div class="container">
      <div class="topbar-wrap">
        <header class="topbar">
          <a href="#" class="brand">
            <img
              class="brand-logo"
              src="https://i.ibb.co/G4dBMDwF/Screenshot-2026-03-09-153726-removebg-preview.webp"
              alt="Valera Launcher logo"
            >
            <span>Valera</span>
          </a>

          <nav class="nav">
            <a href="#" class="active">Home</a>
            <a href="#features">Features</a>
            <a href="#download">Download</a>

            <div class="contact-item" id="contactItem">
              <button class="contact-btn" id="contactBtn" type="button">
                Contacts
                <svg viewBox="0 0 24 24">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </button>

              <div class="contact-menu" id="contactMenu">
                <a
                  class="contact-link"
                  href="https://t.me/Mosterixxxxxx"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <span class="contact-title">Telegram</span>
                  <span class="contact-sub">@Mosterixxxxxx</span>
                </a>
              </div>
            </div>
          </nav>
        </header>
      </div>

      <main class="hero">
        <div class="hero-inner">
          <div class="eyebrow">Fast and clean Minecraft launcher</div>

          <h1>
            Minecraft, but<br>
            streamlined.
          </h1>

          <p class="subtext">
            Valera Launcher is a clean and modern Minecraft launcher for macOS,
            created by Khreshyatikov for a smooth, minimal and focused experience.
          </p>

          <div class="actions" id="download">
            <button class="primary-btn" id="downloadBtn" type="button">
              Download
              <svg viewBox="0 0 24 24">
                <path d="M7 17L17 7"></path>
                <path d="M9 7H17V15"></path>
              </svg>
            </button>

            <a href="#features" class="secondary-btn">Learn more</a>
          </div>
        </div>
      </main>
    </div>

    <div class="footer-note">
      Created by Khreshyatikov
    </div>
  </div>

  <script>
    document.getElementById('downloadBtn').addEventListener('click', function () {
      window.location.href = 'https://github.com/angelosimon/valeralaunch/releases/download/launcher/valeralaucnher.dmg';
    });

    const contactItem = document.getElementById('contactItem');
    const contactBtn = document.getElementById('contactBtn');

    contactBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      contactItem.classList.toggle('open');
    });

    document.addEventListener('click', function (e) {
      if (!contactItem.contains(e.target)) {
        contactItem.classList.remove('open');
      }
    });
  </script>
</body>
</html>
