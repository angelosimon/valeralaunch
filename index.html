<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valera Launcher</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
font-family:'Inter',sans-serif;
background:
linear-gradient(rgba(6,8,18,.55),rgba(6,8,18,.85)),
url("https://i.ibb.co/BJqNWfJ/image.png") center/cover no-repeat;
color:white;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

/* container */

.hero{
max-width:760px;
padding:40px;
animation:fade 1.2s ease;
}

/* logo */

.logo{
width:64px;
margin-bottom:30px;
opacity:.95;
}

/* title */

h1{
font-size:clamp(52px,7vw,90px);
font-weight:500;
letter-spacing:-0.04em;
line-height:1.05;
margin-bottom:20px;
}

/* subtitle */

p{
font-size:17px;
color:rgba(255,255,255,.7);
line-height:1.7;
margin-bottom:40px;
}

/* buttons */

.buttons{
display:flex;
gap:18px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:16px 28px;
border-radius:40px;
background:#6f8cff;
font-weight:500;
font-size:16px;
transition:.25s;
box-shadow:0 15px 40px rgba(111,140,255,.35);
}

.btn:hover{
transform:translateY(-3px);
background:#7d97ff;
box-shadow:0 20px 50px rgba(111,140,255,.45);
}

.btn.secondary{
background:rgba(255,255,255,.08);
box-shadow:none;
}

.btn.secondary:hover{
background:rgba(255,255,255,.15);
}

/* footer */

.footer{
position:absolute;
bottom:24px;
left:0;
right:0;
font-size:13px;
color:rgba(255,255,255,.35);
}

/* animation */

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="hero">

<img class="logo"
src="https://i.ibb.co/G4dBMDwF/Screenshot-2026-03-09-153726-removebg-preview.webp">

<h1>Valera Launcher</h1>

<p>
Fast and minimal Minecraft launcher for macOS and Windows.
Clean design, smooth performance and simple setup.
</p>

<div class="buttons">

<a class="btn"
href="https://github.com/angelosimon/valeralaunch/releases/download/launcher/valeralaucnher.dmg">
Download for macOS
</a>

<a class="btn secondary"
href="https://github.com/angelosimon/valeralaunch/releases/tag/launcher2">
Download for Windows
</a>

</div>

</div>

<div class="footer">
Created by Khreshyatikov
</div>

</body>
</html>
